openapi: 3.0.3
info:
  title: Greeter API
  version: 0.1.0
  description: Returns a JSON greeting for a caller-supplied name.
servers:
  - url: /
paths:
  /hello:
    get:
      operationId: getGreeting
      summary: Greet the caller by name, or with a generic greeting when no name is given
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: The name to greet; omit for a generic greeting
      responses:
        '200':
          description: A JSON greeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Greeting'
components:
  schemas:
    Greeting:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: The greeting text, e.g. "Hello, Alice!"
